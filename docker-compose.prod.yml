services:

  # ── nginx: the container Caddy reverse-proxies to ──────────────────────────
  # Name must match the upstream in the shared Caddyfile (app_elconta:80)
  app_elconta:
    image: nginx:alpine
    container_name: app_elconta
    restart: unless-stopped
    expose: ["80"]
    volumes:
      - ./dev/server/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/static:ro
      - media_files:/app/media:ro
      - temp_files:/app/temp:ro
    depends_on:
      conta_service:
        condition: service_healthy
    networks:
      - numerillos_fa_network   # reachable by Caddy
      - internal                # can reach conta_service

  # ── Django / Gunicorn ───────────────────────────────────────────────────────
  conta_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: elconta_app
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      ENV: production
      POSTGRES_HOST: elconta_db
      POSTGRES_PORT: "5432"
    expose: ["8000"]
    volumes:
      - static_files:/app/static
      - media_files:/app/media
      - temp_files:/app/temp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      elconta_db:
        condition: service_healthy
    networks:
      - internal

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  elconta_db:
    image: postgres:17.4-alpine
    container_name: elconta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  postgres_data:
  static_files:
  media_files:
  temp_files:

networks:
  # Private network — only containers in this file can talk to each other
  internal:
    driver: bridge
  # Shared network — Caddy (in /opt/numerillos) can reach app_elconta:80
  numerillos_fa_network:
    external: true
