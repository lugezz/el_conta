server {
    listen 80;
    server_name _;

    # Static files
    location /static/ {
        alias /app/static/;
    }

    # User-uploaded media
    location /media/ {
        alias /app/media/;
    }

    # Temporary / generated files
    location /temp/ {
        alias /app/temp/;
    }

    # Everything else → Gunicorn
    location / {
        proxy_pass         http://conta_service:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Caddy always terminates TLS, so the downstream is always HTTPS
        proxy_set_header   X-Forwarded-Proto https;
    }
}
