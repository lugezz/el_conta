server {
    listen 80;
    server_name elconta.com.ar www.elconta.com.ar;

    # Allow Let's Encrypt ACME Challenge requests
    location ^~ /.well-known/acme-challenge/ {
        root /app/static;
        allow all;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name elconta.com.ar www.elconta.com.ar;

    ssl_certificate     /etc/letsencrypt/live/elconta.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elconta.com.ar/privkey.pem;

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://conta_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
