services:
  conta_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT}
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      ENV: ${ENV}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres_service
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS}
    expose: ["8000"]
    volumes:
      - static_files:/app/static
      - media_files:/app/media
      - temp_files:/app/temp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres_service:
        condition: service_healthy

  postgres_service:
    image: postgres:17.4-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres_service
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx_service:
    image: nginx:alpine
    depends_on:
      conta_service:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dev/server/develop/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/static:ro
      - media_files:/app/media:ro
      - temp_files:/app/temp:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  static_files:
  media_files:
  temp_files:
